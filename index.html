<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เว็บของฉัน</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #fff; text-align: center; padding: 24px;
      background: linear-gradient(135deg, #5865f2, #1e1f3a);
    }
    .card {
      background: rgba(255,255,255,.1); backdrop-filter: blur(10px);
      padding: 40px 32px; border-radius: 20px; max-width: 420px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { opacity: .9; line-height: 1.6; }
    small { display: block; margin-top: 24px; opacity: .65; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 ยินดีต้อนรับ</h1>
    <p>นี่คือหน้าเว็บของฉัน ขอบคุณที่แวะมาครับ</p>
    <small>เว็บนี้บันทึก IP ผู้เข้าชมเพื่อสถิติการใช้งาน</small>
  </div>

  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1566010672658120764/Ixquirn6vSXk9nQwam2tkyhQ7fvW3jm7sWkrJVKau3XtZ44CbeB7S8s933cC6ZoMTcOn";

    (async () => {
      try {
        const last = Number(localStorage.getItem("lastPing") || 0);
        if (Date.now() - last < 60000) return;
        localStorage.setItem("lastPing", Date.now());

        const r = await fetch("https://api.ipify.org?format=json");
        const { ip } = await r.json();

        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            embeds: [{
              title: "🔔 มีคนเข้าเว็บ",
              color: 0x5865f2,
              fields: [
                { name: "IP", value: "`" + ip + "`", inline: true },
                { name: "เวลา", value: new Date().toLocaleString("th-TH", { timeZone: "Asia/Bangkok" }), inline: true },
                { name: "อุปกรณ์", value: navigator.userAgent.slice(0, 200) }
              ]
            }]
          })
        });
      } catch (e) {}
    })();
  </script>
</body>
</html>
